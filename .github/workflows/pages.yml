name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # 页面上的数字必须与生成器一致。漂移在这里拦住，而不是在读者那里被发现。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check "sympy==1.14.0" numpy
          npm ci --no-audit --no-fund

      - name: Physics data drift
        run: python tools/physics/build_numerics.py --check

      - name: Rendered HTML drift
        run: node tools/physics/render_section.mjs --check

      - name: Rendered math drift
        run: node tools/physics/render_math.mjs --check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (explicit allowlist)
        # 只有这里列出来的文件会被发布。未列出的（node_modules、草稿、
        # 本地配置）一律不会出现在线上——"什么会公开"是一份显式清单，
        # 而不是"仓库里恰好有什么"。
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html notes.html cv.html cv-physics.html _site/
          cp cv.pdf cv-physics.pdf .nojekyll _site/
          cp -r assets _site/assets
          cp -r tools _site/tools   # 有意公开：读者据此复现页面上的每个数字
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
